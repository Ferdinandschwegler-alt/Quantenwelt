<style>

<script>
// ===== STARS =====
(function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars=[];for(let i=0;i<300;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,phase:Math.random()*Math.PI*2,speed:Math.random()*.015+.005});}
  window.addEventListener('resize',resize);resize();
  let t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    t+=0.016;
    stars.forEach(s=>{
      const b=0.4+0.6*Math.abs(Math.sin(s.phase+t*s.speed*60));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(232,208,138,${b*0.85})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== DATA =====
const CHS = [{"n":1,"title":"Einheiten und Messung","part":"I","area":"Klassische Mechanik","text":"<p>Die Physik beginnt mit einer scheinbar einfachen, aber tiefgreifenden Frage: Wie messen wir die Welt? Bevor wir eine einzige Gleichung aufschreiben, bevor wir über Kräfte oder Energie sprechen können, müssen wir uns darauf einigen, wie wir Größen ausdrücken und vergleichen. Diese Grundlage, die Metrologie — die Wissenschaft des Messens — ist das unsichtbare Fundament, auf dem das gesamte Gebäude der Physik ruht.</p>\n\n<p>Eine physikalische Größe besteht immer aus zwei Teilen: einem Zahlenwert und einer Einheit. Die Aussage \"die Strecke beträgt 5\" ist physikalisch bedeutungslos. Erst \"die Strecke beträgt 5 Meter\" ergibt einen Sinn, weil sie eine Relation zu einem internationalen Standard herstellt. Dieser Standard, der Meter, ist heute nicht mehr durch einen Platinstab in Paris definiert, sondern durch die Lichtgeschwindigkeit: Ein Meter ist genau die Strecke, die Licht im Vakuum in 1/299.792.458 Sekunden zurücklegt. Diese Definition zeigt bereits, wie eng verschiedene physikalische Größen miteinander verknüpft sind.</p>\n\n<p>Das internationale Einheitensystem SI (Système International d'Unités) definiert sieben Basiseinheiten, aus denen alle anderen Größen abgeleitet werden können. Diese sieben Einheiten sind: der Meter (m) für die Länge, das Kilogramm (kg) für die Masse, die Sekunde (s) für die Zeit, das Ampere (A) für die elektrische Stromstärke, das Kelvin (K) für die thermodynamische Temperatur, das Mol (mol) für die Stoffmenge und die Candela (cd) für die Lichtstärke. Jede dieser Basiseinheiten ist durch eine Naturkonstante definiert. Das Kilogramm beispielsweise ist seit 2019 durch den exakten Wert des Planckschen Wirkungsquantums h = 6,626 × 10⁻³⁴ J·s definiert — eine Revolution gegenüber der früheren Definition durch den physischen Urkilogramm-Zylinder in Sèvres bei Paris.</p>\n\n<p>Abgeleitete Einheiten entstehen durch algebraische Kombinationen der Basiseinheiten. Die Einheit der Kraft, das Newton (N), lässt sich ausschreiben als N = kg·m/s². Die Einheit der Energie, das Joule (J), ergibt sich zu J = kg·m²/s². Diese Ableitungen sind nicht willkürlich, sondern folgen aus den physikalischen Gesetzen selbst. Wenn wir verstehen, dass Kraft gleich Masse mal Beschleunigung ist (F = m·a), und dass Beschleunigung die Einheit m/s² trägt, dann folgt die Einheit der Kraft zwingend.</p>\n\n<p>Ein mächtiges Werkzeug, das Ihnen helfen wird, Gleichungen zu überprüfen und neue herzuleiten, ist die Dimensionsanalyse. Jede physikalische Größe lässt sich in Grunddimensionen ausdrücken: Länge [L], Masse [M], Zeit [T], elektrische Stromstärke [I], Temperatur [Θ], Stoffmenge [N] und Lichtstärke [J]. Eine physikalisch sinnvolle Gleichung muss auf beiden Seiten dieselben Dimensionen haben. Diese Bedingung, die dimensionale Homogenität, ist eine notwendige (aber nicht hinreichende) Bedingung für die Korrektheit einer Gleichung.</p>\n\n<p>Betrachten wir ein Beispiel: Wir wissen aus der Mechanik, dass die Periode eines einfachen Pendels von seiner Länge L und der Erdbeschleunigung g abhängen muss. Die Periode T hat die Dimension [T] = s. Die Länge hat [L] = m, und die Erdbeschleunigung hat die Dimension [g] = m/s². Wenn T proportional zu Lᵃ·gᵇ ist, dann muss gelten: s = mᵃ·(m/s²)ᵇ = m^(a+b)·s^(-2b). Daraus folgt -2b = 1, also b = -1/2, und a + b = 0, also a = 1/2. Die Periode muss daher proportional zu √(L/g) sein, was tatsächlich mit T = 2π√(L/g) übereinstimmt.</p>\n\n<p>Beim Messen physikalischer Größen sind Fehler und Unsicherheiten unvermeidlich. Man unterscheidet systematische Fehler, die durch fehlerhafte Kalibrierung oder systematische Einflüsse entstehen und reproduzierbar sind, von zufälligen Fehlern, die statistisch streuen. Die Genauigkeit einer Messung beschreibt, wie nah das Ergebnis am wahren Wert liegt. Die Präzision beschreibt, wie gut Messungen untereinander übereinstimmen. Eine sehr präzise Messung kann dennoch ungenau sein, wenn ein systematischer Fehler vorliegt.</p>\n\n<p>Signifikante Stellen sind das Mittel, mit dem wir die Messgenauigkeit einer Zahl kommunizieren. Die Zahl 3,14 hat drei signifikante Stellen und bedeutet, dass wir den Wert auf die zweite Dezimalstelle genau kennen. Bei der Multiplikation oder Division bestimmt die Zahl mit den wenigsten signifikanten Stellen die Genauigkeit des Ergebnisses. Bei Addition und Subtraktion bestimmt die letzte relevante Dezimalstelle die Genauigkeit. Diese Regeln verhindern, dass durch Rechenoperationen eine Scheingenauigkeit entsteht, die die Messdaten nicht rechtfertigen.</p>\n\n<p>Die wissenschaftliche Notation, also das Schreiben von Zahlen in der Form a × 10ⁿ, ist unverzichtbar in der Physik, wo Größen über viele Größenordnungen variieren. Der Radius eines Atomkerns beträgt etwa 10⁻¹⁵ m, die Entfernung zur Andromeda-Galaxie etwa 2,4 × 10²² m — ein Verhältnis von über 37 Größenordnungen. Präfixe wie Nano- (10⁻⁹), Mikro- (10⁻⁶), Milli- (10⁻³), Kilo- (10³), Mega- (10⁶) und Giga- (10⁹) helfen, Zahlen in einem handlichen Bereich zu halten.</p>\n\n<p>Schließlich ist die Kunst des Abschätzens — das Fermi-Schätzen — eine Kernkompetenz des Physikers. Enrico Fermi war berühmt dafür, mit wenigen überschlägigen Überlegungen erstaunlich genaue Antworten zu erhalten. Die klassische Fermi-Frage lautet: \"Wie viele Klavierstimmer gibt es in Chicago?\" Durch schrittweises Schätzen — Einwohnerzahl, Anteil der Haushalte mit Klavier, Stimmhäufigkeit, Arbeitskapazität eines Stimmers — gelangt man zu einer vernünftigen Größenordnung. Diese Fähigkeit, schnell zu beurteilen, ob ein Ergebnis plausibel ist, ist in der Physik so wertvoll wie algebraische Rechenfertigkeit.</p>\n\n<p>Mit diesem Fundament — SI-Einheiten, Dimensionsanalyse, signifikante Stellen und Größenordnungsschätzungen — sind Sie bereit, die eigentlichen physikalischen Inhalte zu erkunden. Sie werden feststellen, dass ein sicheres Beherrschen dieser Grundlagen Ihnen immer wieder aus der Klemme hilft, wenn Formeln kompliziert werden oder Rechnungen ausufern.</p>","q1":"Berechnen Sie, welche Einheit das Produkt aus Kraft (N = kg·m/s²) und Geschwindigkeit (m/s) hat. Welche physikalische Größe hat diese Einheit?","s1":"Kraft × Geschwindigkeit = (kg·m/s²) × (m/s) = kg·m²/s³. Diese Einheit ist identisch mit der Einheit der Leistung P = J/s = W (Watt). Das Produkt F·v gibt also die Leistung an, die eine Kraft an einem Körper verrichtet, der sich mit Geschwindigkeit v bewegt: P = F·v.","q2":"Nutzen Sie die Dimensionsanalyse, um zu zeigen, dass die Formel für die Druckwelle-Ausbreitungsgeschwindigkeit v = √(E/ρ) dimensionsmäßig konsistent ist. Dabei ist E der Elastizitätsmodul mit Einheit Pa = N/m² = kg/(m·s²) und ρ die Dichte mit Einheit kg/m³.","s2":"[v] = √([E]/[ρ]) = √( (kg/(m·s²)) / (kg/m³) ) = √( (kg·m³) / (m·kg·s²) ) = √(m²/s²) = m/s. Das ist korrekt die Einheit einer Geschwindigkeit. Die Gleichung ist also dimensionsmäßig konsistent.","q3":"Schätzen Sie nach der Fermi-Methode die Anzahl der Atome in einer 10-Cent-Münze. Die Münze besteht überwiegend aus Kupfer (Atommasse ≈ 64 u), hat eine Masse von etwa 4 g, und 1 u ≈ 1,66 × 10⁻²⁷ kg.","s3":"Masse der Münze: m = 4 g = 4 × 10⁻³ kg. Masse eines Kupferatoms: m_Cu = 64 × 1,66 × 10⁻²⁷ kg ≈ 1,06 × 10⁻²⁵ kg. Anzahl der Atome: N = m / m_Cu = (4 × 10⁻³) / (1,06 × 10⁻²⁵) ≈ 3,8 × 10²² Atome. Eine 10-Cent-Münze enthält also etwa 4 × 10²² Atome — eine gigantische Zahl, die die Welt des Allerkleinsten greifbar macht."},{"n":2,"title":"Skalare und Vektoren","part":"I","area":"Klassische Mechanik","text":"<p>Eine der fundamentalsten Unterscheidungen in der Physik trennt physikalische Größen in zwei Klassen: Skalare und Vektoren. Diese Unterscheidung ist nicht bloß mathematischer Natur — sie spiegelt eine tiefe Eigenschaft der physikalischen Realität wider und bestimmt, wie sich Größen unter Drehungen und Spiegelungen des Koordinatensystems transformieren.</p>\n\n<p>Ein Skalar ist eine Größe, die vollständig durch einen Zahlenwert (mit Einheit) beschrieben wird. Temperatur, Masse, Zeit, Energie und Druck sind Skalare. Wenn Sie sagen \"die Temperatur beträgt 20 Grad Celsius\", dann haben Sie die Größe vollständig angegeben — eine Richtungsangabe wäre sinnlos. Skalare bleiben bei einem Wechsel des Koordinatensystems unverändert. Ein Körper mit der Masse 5 kg hat diese Masse unabhängig davon, wie wir unser Koordinatensystem ausrichten.</p>\n\n<p>Ein Vektor hingegen ist eine Größe, die durch Betrag und Richtung charakterisiert ist. Geschwindigkeit, Beschleunigung, Kraft und Impuls sind Vektoren. Die Aussage \"eine Kraft von 10 Newton\" ist unvollständig — wir müssen auch angeben, in welche Richtung die Kraft wirkt. Geometrisch stellt man Vektoren als gerichtete Pfeile dar, wobei die Länge des Pfeils dem Betrag des Vektors entspricht.</p>\n\n<p>In der Komponentendarstellung schreibt man einen Vektor im dreidimensionalen Raum als v⃗ = vₓ ê_x + v_y ê_y + v_z ê_z, wobei ê_x, ê_y, ê_z die Einheitsvektoren in x-, y- und z-Richtung sind und vₓ, v_y, v_z die skalaren Komponenten des Vektors. Der Betrag des Vektors ergibt sich nach dem verallgemeinerten Pythagoras: |v⃗| = √(vₓ² + v_y² + v_z²). Diese Schreibweise ist außerordentlich praktisch, weil Vektoroperationen auf Komponentenoperationen zurückgeführt werden können.</p>\n\n<p>Die Addition zweier Vektoren a⃗ und b⃗ ergibt komponentenweise: a⃗ + b⃗ = (aₓ + bₓ, a_y + b_y, a_z + b_z). Geometrisch entspricht dies der Parallelogramm- oder Dreiecksregel: Man legt den Anfang von b⃗ an das Ende von a⃗ und der Summenvektor zeigt vom Anfang von a⃗ zum Ende von b⃗. Die Subtraktion wird analog behandelt: a⃗ - b⃗ = a⃗ + (-b⃗), wobei -b⃗ der Vektor mit umgekehrter Richtung ist.</p>\n\n<p>Das Skalarprodukt (inneres Produkt) zweier Vektoren ist definiert als a⃗ · b⃗ = |a⃗| |b⃗| cos(θ), wobei θ der Winkel zwischen den beiden Vektoren ist. In Komponentenschreibweise: a⃗ · b⃗ = aₓbₓ + a_y b_y + a_z b_z. Das Ergebnis ist ein Skalar, also richtungslos. Das Skalarprodukt hat eine wichtige geometrische Bedeutung: Es gibt an, wie viel von Vektor a⃗ in die Richtung von b⃗ projiziert wird (multipliziert mit |b⃗|). Wenn a⃗ ⊥ b⃗, dann ist das Skalarprodukt null, da cos(90°) = 0. Das Skalarprodukt wird später bei der Definition der Arbeit (W = F⃗ · d⃗) eine zentrale Rolle spielen.</p>\n\n<p>Das Vektorprodukt (Kreuzprodukt) a⃗ × b⃗ ist ein Vektor, der senkrecht auf a⃗ und b⃗ steht, mit dem Betrag |a⃗ × b⃗| = |a⃗| |b⃗| sin(θ). Die Richtung wird durch die Rechte-Hand-Regel bestimmt: Wenn die Finger der rechten Hand von a⃗ nach b⃗ gekrümmt werden, zeigt der Daumen in die Richtung von a⃗ × b⃗. In Komponentenschreibweise ergibt sich: (a⃗ × b⃗)ₓ = a_y b_z - a_z b_y, und zyklisch für y und z. Das Kreuzprodukt ist antikommutativ: a⃗ × b⃗ = -b⃗ × a⃗. Es wird bei der Berechnung von Drehmomenten (τ⃗ = r⃗ × F⃗) und Lorentzkräften unverzichtbar sein.</p>\n\n<p>Einheitsvektoren haben per Definition den Betrag 1 und geben nur eine Richtung an. Man erhält den Einheitsvektor in Richtung von a⃗ durch Division durch den Betrag: â = a⃗ / |a⃗|. Die Einheitsvektoren der kartesischen Koordinatenachsen (î, ĵ, k̂ oder ê_x, ê_y, ê_z) bilden eine orthonormale Basis: Sie sind paarweise senkrecht zueinander und haben den Betrag 1. Es gilt daher: î · î = 1, î · ĵ = 0, î × ĵ = k̂, und zyklisch.</p>\n\n<p>Eine wichtige Anwendung der Vektorzerlegung ist die Analyse von Kräften an schiefen Ebenen. Wenn ein Körper auf einer geneigten Fläche liegt, die den Winkel α mit der Horizontalen einschließt, dann kann die Gewichtskraft F⃗_G = m g (-ê_y) in zwei Komponenten zerlegt werden: F_∥ = mg sin(α) parallel zur Ebene (hangabwärts) und F_⊥ = mg cos(α) senkrecht zur Ebene (in die Fläche). Diese Zerlegung ist der erste Schritt zur Berechnung von Reibungskräften und Beschleunigungen auf der schiefen Ebene.</p>\n\n<p>In der Physik begegnen uns Vektoren auf einer tieferen Ebene als bloße mathematische Hilfsmittel: Sie sind geometrische Objekte, die sich unter Koordinatentransformationen auf eine bestimmte Art transformieren. Ein dreidimensionaler Vektor transformiert sich unter einer Drehung des Koordinatensystems durch eine 3×3-Rotationsmatrix. Diese Transformationseigenschaft ist tatsächlich die präzise mathematische Definition eines Vektors — und dieses Konzept lässt sich verallgemeinern zu Tensoren zweiter und höherer Stufe, die wir in der Relativitätstheorie antreffen werden.</p>\n\n<p>Schließlich sei erwähnt, dass es Pseudovektoren (auch axiale Vektoren) gibt, die sich unter einer Spiegelung anders verhalten als gewöhnliche Vektoren (polare Vektoren). Das magnetische Feld B⃗ und der Drehimpuls L⃗ sind Pseudovektoren. Ihre Richtung kehrt sich bei einer Raumspiegelung nicht um — ein Phänomen, das in der Teilchenphysik tiefe Konsequenzen hat. Für unsere unmittelbaren Zwecke genügt das Konzept des polaren Vektors vollkommen.</p>","q1":"Ein Flugzeug fliegt mit Eigengeschwindigkeit v⃗_F = (400, 0) km/h. Ein Seitenwind weht mit v⃗_W = (0, 80) km/h. Berechnen Sie den Betrag und den Winkel (gegenüber der Vorwärtsrichtung) der resultierenden Geschwindigkeit v⃗ = v⃗_F + v⃗_W.","s1":"v⃗ = (400 + 0, 0 + 80) = (400, 80) km/h. Betrag: |v⃗| = √(400² + 80²) = √(160000 + 6400) = √166400 ≈ 407,9 km/h. Winkel: θ = arctan(80/400) = arctan(0,2) ≈ 11,3°. Das Flugzeug bewegt sich also etwa 407,9 km/h schnell in einer Richtung, die 11,3° seitlich versetzt ist.","q2":"Zeigen Sie, dass das Skalarprodukt a⃗ · b⃗ für senkrechte Vektoren a⃗ = (3, 4, 0) und einen Vektor b⃗ = (b₁, b₂, 0) die Bedingung 3b₁ + 4b₂ = 0 ergibt. Finden Sie einen konkreten Vektor b⃗ mit |b⃗| = 5, der dazu senkrecht ist.","s2":"Das Skalarprodukt ist a⃗ · b⃗ = 3b₁ + 4b₂ + 0 = 0, also muss 3b₁ = -4b₂ gelten. Ein einfacher Ansatz: b⃗ = (4, -3, 0). Überprüfung: 3·4 + 4·(-3) = 12 - 12 = 0. Betrag: |b⃗| = √(16 + 9) = √25 = 5. Der gesuchte Vektor ist b⃗ = (4, -3, 0). Allgemein erhält man den senkrechten Vektor durch Vertauschen der Komponenten und Negation einer davon.","q3":"Berechnen Sie das Kreuzprodukt a⃗ × b⃗ für a⃗ = (1, 2, 0) und b⃗ = (3, 0, 0). Überprüfen Sie, dass der Ergebnisvektor tatsächlich senkrecht auf beiden Ausgangsvektoren steht.","s3":"a⃗ × b⃗ = (2·0 - 0·0, 0·3 - 1·0, 1·0 - 2·3) = (0, 0, -6). Überprüfung Senkrecht auf a⃗: (1,2,0)·(0,0,-6) = 0+0+0 = 0. Überprüfung senkrecht auf b⃗: (3,0,0)·(0,0,-6) = 0+0+0 = 0. Das Kreuzprodukt zeigt in die negative z-Richtung mit Betrag 6. Nach der Rechten-Hand-Regel: Finger von a⃗ zu b⃗ (von links nach rechts), Daumen zeigt nach unten (-z). Das stimmt überein."},{"n":3,"title":"Kinematik in einer Dimension","part":"I","area":"Klassische Mechanik","text":"<p>Die Kinematik ist die Beschreibung von Bewegungen ohne Rücksicht auf die Ursachen. Sie fragt: Wie bewegt sich ein Körper? Wann ist er wo? Wie schnell? Wie beschleunigt? Diese scheinbar simplen Fragen führen zu einem eleganten mathematischen Apparat, der das Fundament der klassischen Mechanik bildet.</p>\n\n<p>Wir betrachten zunächst die eindimensionale Bewegung eines Punktteilchens. Der Ort x(t) des Teilchens ist eine Funktion der Zeit t. Die momentane Geschwindigkeit ist definiert als die Ableitung des Ortes nach der Zeit: v(t) = dx/dt = ẋ. Diese Definition erfasst die augenblickliche Änderungsrate des Ortes — nicht den Durchschnitt über ein Zeitintervall, sondern den Grenzwert für ein infinitesimal kleines Intervall. Diese Unterscheidung zwischen Momentan- und Durchschnittsgeschwindigkeit ist fundamental: Ein Auto, das in 1 Stunde 100 km zurücklegt, hat eine Durchschnittsgeschwindigkeit von 100 km/h, war aber möglicherweise zwischenzeitlich viel schneller oder stand bei einer Ampel still.</p>\n\n<p>Die momentane Beschleunigung ist die Ableitung der Geschwindigkeit nach der Zeit, oder gleichwertig, die zweite Ableitung des Ortes: a(t) = dv/dt = d²x/dt² = ẍ. Die Beschleunigung kann positiv (Geschwindigkeit nimmt zu) oder negativ (Geschwindigkeit nimmt ab, Verzögerung) sein. Im SI-System hat die Beschleunigung die Einheit m/s².</p>\n\n<p>Den einfachsten und zugleich wichtigsten Sonderfall stellt die gleichförmig beschleunigte Bewegung dar, bei der die Beschleunigung a = const ist. Durch zweimalige Integration gelangt man zu den kinematischen Gleichungen, die als \"heilige Schriften\" der Mechanik-Anfänger gelten: v(t) = v₀ + at und x(t) = x₀ + v₀t + ½at². Dabei sind x₀ der Anfangsort und v₀ die Anfangsgeschwindigkeit zum Zeitpunkt t = 0. Eine dritte nützliche Beziehung ergibt sich durch Elimination der Zeit: v² = v₀² + 2a(x - x₀). Diese drei Gleichungen — und ihre geometrischen Analoga im Orts-Zeit- und Geschwindigkeit-Zeit-Diagramm — sind der Schlüssel zu unzähligen Problemen in der Mechanik.</p>\n\n<p>Ein klassisches Beispiel ist der freie Fall. Ein Körper, der im Schwerefeld der Erde (ohne Luftwiderstand) fallen gelassen wird, erfährt eine konstante Beschleunigung g = 9,81 m/s² senkrecht nach unten. Mit x₀ = 0 (Startpunkt als Nullpunkt, positiv nach oben) und v₀ = 0 (Körper fällt aus der Ruhe): v(t) = -gt und x(t) = -½gt². Nach t Sekunden hat der Körper die Geschwindigkeit -gt und befindet sich auf der Höhe -½gt². Der negative Vorzeichencode spiegelt wider, dass die Bewegung nach unten gerichtet ist.</p>\n\n<p>Im Orts-Zeit-Diagramm (x gegen t) erscheint die gleichförmige Bewegung (a = 0) als Gerade, deren Steigung die Geschwindigkeit ist. Die gleichförmig beschleunigte Bewegung erscheint als Parabel. Die Steigung der Tangente an die Parabel an jedem Punkt gibt die Momentangeschwindigkeit an. Im Geschwindigkeit-Zeit-Diagramm (v gegen t) erscheint die gleichförmig beschleunigte Bewegung als Gerade. Die Steigung dieser Geraden ist die Beschleunigung. Besonders wichtig: Die Fläche unter der v-t-Kurve zwischen zwei Zeitpunkten gibt die in diesem Intervall zurückgelegte Strecke an. Dies ist geometrisch das Integral ∫v dt = Δx.</p>\n\n<p>Für einen Wurf nach oben mit Anfangsgeschwindigkeit v₀ > 0 (nach oben positiv) gilt: x(t) = v₀t - ½gt². Der Körper steigt zunächst auf, erreicht den Scheitelpunkt, wenn v = 0, also bei t_S = v₀/g. Die maximale Höhe beträgt x_max = v₀²/(2g). Anschließend fällt er zurück. Bemerkenswert: Der Körper kehrt nach der Zeit t_R = 2v₀/g (doppelte Scheitelzeit) zum Ausgangspunkt zurück, mit der Geschwindigkeit -v₀ — genau so schnell, aber entgegengesetzt gerichtet. Dieses Ergebnis hat die elegante Konsequenz, dass die v-t-Kurve symmetrisch um den Scheitelpunkt ist.</p>\n\n<p>Die Konzepte von Weg, Verschiebung und Geschwindigkeit sind sorgfältig zu unterscheiden. Die Verschiebung Δx = x(t₂) - x(t₁) ist ein Vektor (in 1D: ein vorzeichenbehafteter Skalar), der vom Startpunkt zum Endpunkt zeigt. Der zurückgelegte Weg (Weglänge) ist das Integral über den Betrag der Geschwindigkeit und gibt die gesamte zurückgelegte Strecke an, unabhängig von der Richtung. Ein Läufer, der 400 m auf einer Kreisbahn läuft und zum Startpunkt zurückkehrt, hat eine Verschiebung von 0, aber einen Weg von 400 m.</p>\n\n<p>Das Konzept der Integration in der Kinematik erschließt noch tiefer gehende Zusammenhänge. Wenn die Beschleunigung eine beliebige Funktion der Zeit ist, a(t), dann ergibt sich die Geschwindigkeit durch Integration: v(t) = v₀ + ∫₀ᵗ a(t') dt'. Der Ort folgt durch erneute Integration: x(t) = x₀ + ∫₀ᵗ v(t') dt'. Für den Fall a = const reduzieren diese Formeln auf die kinematischen Gleichungen, aber das Prinzip ist allgemein gültig und bildet die Basis numerischer Simulationen in der modernen Physik.</p>\n\n<p>Relativgeschwindigkeiten entstehen, wenn Bewegungen aus verschiedenen Referenzsystemen betrachtet werden. Beobachter A bewegt sich mit v_AB relativ zu B. Beobachter B sieht ein Objekt C mit v_BC. Für nicht-relativistische Geschwindigkeiten gilt: v_AC = v_AB + v_BC. Diese galileische Additivität der Geschwindigkeiten klingt trivial, wird aber im Rahmen der speziellen Relativitätstheorie fundamental modifiziert — ein Thema für Kapitel 133.</p>","q1":"Ein Stein wird von einem Turm der Höhe h = 45 m mit der Anfangsgeschwindigkeit v₀ = 10 m/s senkrecht nach oben geworfen (g = 10 m/s²). Berechnen Sie: (a) die maximale Höhe des Steins über dem Boden, (b) den Zeitpunkt, wann der Stein den Boden erreicht, (c) die Auftreffgeschwindigkeit.","s1":"(a) Der Stein wird von h=45m nach oben geworfen. Scheitelzeit: t_S = v₀/g = 10/10 = 1 s. Höhe über Startpunkt: Δh = v₀t_S - ½g t_S² = 10·1 - 5·1 = 5 m. Maximale Höhe: H = 45 + 5 = 50 m. (b) Mit x(t) = 45 + 10t - 5t² = 0: 5t² - 10t - 45 = 0, t² - 2t - 9 = 0. Lösungsformel: t = (2 ± √(4+36))/2 = 1 ± √10. Die positive Lösung: t = 1 + √10 ≈ 1 + 3,162 = 4,162 s. (c) v = v₀ - gt = 10 - 10·4,162 = -31,62 m/s. Betrag: v ≈ 31,6 m/s. Alternativ: v² = v₀² + 2g·H = 100 + 2·10·50 = 1100, v = √1100 ≈ 33,2 m/s (von der maximalen Höhe).","q2":"Ein Zug bremst aus v₀ = 72 km/h gleichmäßig ab und hält nach s = 200 m an. Berechnen Sie die Verzögerung a und die Bremszeit t. Wie lange bräuchte er zum Anhalten, wenn er 144 km/h schnell wäre und gleich stark bremste?","s2":"v₀ = 72 km/h = 20 m/s. Aus v² = v₀² + 2as mit v = 0: 0 = 400 + 2a·200, a = -400/400 = -1 m/s². Bremszeit: 0 = 20 + (-1)t, t = 20 s. Für v₀ = 144 km/h = 40 m/s: t' = v₀'/|a| = 40/1 = 40 s. Wichtig: Die Bremszeit ist proportional zur Anfangsgeschwindigkeit, aber der Bremsweg ist proportional zum Quadrat der Anfangsgeschwindigkeit (s' = v₀'²/(2|a|) = 1600/2 = 800 m). Eine Verdoppelung der Geschwindigkeit vervierfacht den Bremsweg!","q3":"Leiten Sie die kinematische Gleichung v² = v₀² + 2a(x-x₀) her, indem Sie die Zeit t aus den beiden Gleichungen v = v₀ + at und x = x₀ + v₀t + ½at² eliminieren.","s3":"Aus der ersten Gleichung: t = (v - v₀)/a. Einsetzen in die zweite: x - x₀ = v₀·(v-v₀)/a + ½a·((v-v₀)/a)² = v₀(v-v₀)/a + (v-v₀)²/(2a). Multiplizieren mit 2a: 2a(x-x₀) = 2v₀(v-v₀) + (v-v₀)². Ausmultiplizieren: = 2v₀v - 2v₀² + v² - 2v₀v + v₀² = v² - v₀². Damit folgt: v² = v₀² + 2a(x-x₀). Diese Gleichung verknüpft Geschwindigkeit und Ort direkt, ohne den Umweg über die Zeit."},{"n":4,"title":"Kinematik in zwei Dimensionen","part":"I","area":"Klassische Mechanik","text":"<p>Die Erweiterung der Kinematik auf zwei und drei Dimensionen erfordert den Übergang von skalaren Größen zu Vektoren. Der Ort eines Teilchens wird nun durch den Ortsvektor r⃗(t) = x(t) ê_x + y(t) ê_y + z(t) ê_z beschrieben. Die vektorielle Geschwindigkeit ist die zeitliche Ableitung: v⃗(t) = dr⃗/dt = vₓ(t) ê_x + v_y(t) ê_y + v_z(t) ê_z, und die vektorielle Beschleunigung entsprechend a⃗(t) = dv⃗/dt.</p>\n\n<p>Das Schöne an der vektoriellen Schreibweise ist, dass die kinematischen Gleichungen für konstante Beschleunigung formal unverändert bleiben: v⃗(t) = v⃗₀ + a⃗·t und r⃗(t) = r⃗₀ + v⃗₀·t + ½a⃗·t². Diese Gleichungen sind vektorielle Kurzschreibweisen für je zwei (2D) oder drei (3D) skalare Gleichungen, eine pro Komponente. Da die verschiedenen Komponenten unabhängig voneinander integriert werden, kann man jede Richtung getrennt analysieren. Dies ist das Superpositionsprinzip der Kinematik.</p>\n\n<p>Der wichtigste Spezialfall der zweidimensionalen Bewegung ist der schräge Wurf. Ein Körper wird mit der Anfangsgeschwindigkeit v₀ unter dem Winkel θ₀ gegenüber der Horizontalen abgeworfen. In x-Richtung (horizontal) wirkt keine Kraft, also ist aₓ = 0. In y-Richtung (vertikal) wirkt die Erdbeschleunigung: a_y = -g. Die Anfangskomponenten sind: v₀ₓ = v₀ cos(θ₀) und v₀_y = v₀ sin(θ₀).</p>\n\n<p>Die Bewegungsgleichungen lauten dann: x(t) = v₀ cos(θ₀) · t und y(t) = v₀ sin(θ₀) · t - ½g t². Die Bahn im x-y-Raum erhält man durch Elimination von t: aus x(t) folgt t = x / (v₀ cos θ₀), eingesetzt in y(t): y = x tan(θ₀) - g x² / (2 v₀² cos²θ₀). Dies ist eine Parabel — genau wie im freien Fall, nur in zwei Dimensionen ausgedehnt. Der schräge Wurf beschreibt nicht nur den Ball im Sport, sondern auch die Bahn von Kanonenkugeln, Raketen (im Anfangsstadium), Wasserstrahlen und vieles mehr.</p>\n\n<p>Die Wurfweite — die horizontale Strecke, nach der der Körper wieder die Abwurfhöhe erreicht — ergibt sich zu: R = v₀² sin(2θ₀) / g. Diese Formel hat eine elegante Konsequenz: Die Wurfweite ist maximal für θ₀ = 45°, und sie ist symmetrisch: Winkel θ und (90° - θ) ergeben dieselbe Wurfweite. So erzielt ein Abwurfwinkel von 30° dieselbe Weite wie 60° — ein nicht-intuitives Ergebnis, das man leicht experimentell überprüfen kann.</p>\n\n<p>Die maximale Höhe beträgt H = v₀² sin²(θ₀) / (2g). Bei einem Würfer mit v₀ = 20 m/s und θ₀ = 45° ergibt sich H = 400 × 0,5 / 19,6 ≈ 10,2 m und R = 400 × 1 / 9,8 ≈ 40,8 m.</p>\n\n<p>Die Kreisbewegung ist ein weiterer wichtiger zweidimensionaler Fall. Ein Körper, der sich mit konstantem Betrag |v⃗| = v auf einem Kreis mit Radius r bewegt (gleichförmige Kreisbewegung), erfährt dennoch eine Beschleunigung, da sich die Richtung der Geschwindigkeit ständig ändert. Diese Zentripetalbeschleunigung zeigt stets zum Mittelpunkt des Kreises und hat den Betrag: a_z = v² / r = ω² r. Dabei ist ω = v/r die Winkelgeschwindigkeit in rad/s. Die Zentripetalbeschleunigung ist kein mysteriöses Phänomen — sie ist die direkte Konsequenz der Richtungsänderung der Geschwindigkeit und der mathematischen Definition der Ableitung.</p>\n\n<p>Die Perioden- und Frequenzbegriffe sind für die Kreisbewegung zentral. Die Umlaufzeit T ist die Zeit für eine vollständige Umdrehung: T = 2πr/v = 2π/ω. Die Frequenz f = 1/T gibt an, wie viele Umdrehungen pro Sekunde stattfinden. Die Winkelgeschwindigkeit ω = 2πf verbindet beide Größen.</p>\n\n<p>Für nicht-gleichförmige Kreisbewegungen (Betrag der Geschwindigkeit ändert sich) gibt es neben der radialen Zentripetalbeschleunigung a_r = v²/r auch eine tangentiale Beschleunigung a_t = dv/dt, die tangential zur Bahn wirkt und den Betrag der Geschwindigkeit verändert. Die Gesamtbeschleunigung ist: |a⃗| = √(a_r² + a_t²).</p>\n\n<p>Das Konzept der Relativbewegung spielt in der 2D-Kinematik eine wichtige Rolle. Das klassische Beispiel ist der Fluss mit Strömung: Ein Boot mit Eigengeschwindigkeit v⃗_Boot relativ zum Wasser, das Wasser fließt mit v⃗_Fluss relativ zum Ufer. Die Geschwindigkeit des Bootes relativ zum Ufer ist v⃗_gesamt = v⃗_Boot + v⃗_Fluss. Soll das Boot senkrecht den Fluss überqueren (also kein seitlicher Drift), muss es schräg gegen die Strömung ausrichten. Die optimale Überquerungszeit (kürzeste Überquerung) und der kürzeste Weg sind verschiedene Optimierungsaufgaben, die beide die Vektoraddition nutzen.</p>","q1":"Ein Ball wird horizontal mit v₀ = 15 m/s von einem Felsen der Höhe h = 80 m abgeworfen (g = 10 m/s²). Berechnen Sie (a) die Flugzeit, (b) die horizontale Wurfweite, (c) die Auftreffgeschwindigkeit (Betrag und Richtung).","s1":"(a) Vertikale Bewegung: -h = -½g t², t = √(2h/g) = √(160/10) = √16 = 4 s. (b) Wurfweite: x = v₀ t = 15 × 4 = 60 m. (c) Geschwindigkeitskomponenten beim Aufprall: vₓ = 15 m/s (konstant), v_y = -gt = -40 m/s. Betrag: v = √(15² + 40²) = √(225+1600) = √1825 ≈ 42,7 m/s. Winkel zur Horizontalen: α = arctan(40/15) = arctan(2,67) ≈ 69,4° nach unten.","q2":"Leiten Sie die Formel für die Wurfweite R = v₀² sin(2θ₀)/g her. Zeigen Sie, warum die Wurfweite für θ₀ = 45° maximal wird. Für welche zwei Winkel erhält man dieselbe Wurfweite wie für θ₀ = 30°?","s2":"x(t) = v₀ cosθ t, y(t) = v₀ sinθ t - ½gt². Bodentreffer y = 0: t(v₀ sinθ - ½gt) = 0. Nicht-triviale Lösung: t_R = 2v₀ sinθ/g. Einsetzen in x: R = v₀ cosθ · (2v₀ sinθ/g) = 2v₀² sinθ cosθ/g = v₀² sin(2θ)/g (da sin 2θ = 2 sinθ cosθ). Maximum: sin(2θ) = 1 wenn 2θ = 90°, also θ = 45°. Für θ = 30°: sin(2×30°) = sin(60°) = √3/2. Gleiche Wurfweite für θ' mit sin(2θ') = √3/2, also 2θ' = 120°, θ' = 60°. Die Paare 30° und 60° liefern dieselbe Wurfweite.","q3":"Ein Satellit umkreist die Erde auf einer kreisförmigen Bahn in 200 km Höhe (Erdradius R_E = 6371 km, g_Oberfläche = 9,81 m/s²). Berechnen Sie mit der Formel für die Zentripetalbeschleunigung die Umlaufgeschwindigkeit und die Umlaufzeit des Satelliten. Verwenden Sie g(r) = g·R_E²/r².","s3":"r = R_E + h = 6371 + 200 = 6571 km = 6,571 × 10⁶ m. g(r) = 9,81 × (6371/6571)² = 9,81 × 0,9399 = 9,22 m/s². Für Kreisbewegung: a_z = v²/r = g(r). v = √(g(r)·r) = √(9,22 × 6,571×10⁶) = √(60,58×10⁶) ≈ 7784 m/s ≈ 7,8 km/s. Umlaufzeit: T = 2πr/v = 2π × 6,571×10⁶ / 7784 ≈ 5305 s ≈ 88,4 Minuten. Die ISS umkreist die Erde in ähnlicher Höhe alle ~92 Minuten — unsere Rechnung ist sehr nah dran."},{"n":5,"title":"Newtonsche Gesetze","part":"I","area":"Klassische Mechanik","text":"<p>Isaac Newtons drei Gesetze der Bewegung, formuliert in seinen Principia Mathematica von 1687, sind eine der bedeutendsten intellektuellen Leistungen der Menschheitsgeschichte. Sie beschreiben in verblüffend einfacher Form, wie Kräfte Bewegungen verursachen und verändern, und legten das Fundament für die klassische Mechanik — ein Fundament, das für drei Jahrhunderte als vollständig galt und auch heute noch für den Bereich mittelgroßer Objekte bei nicht-relativistischen Geschwindigkeiten vollkommen präzise ist.</p>\n\n<p>Newtons erstes Gesetz, das Trägheitsgesetz, lautet: Ein Körper verharrt im Zustand der Ruhe oder der gleichförmig-geradlinigen Bewegung, solange keine Nettokraft auf ihn einwirkt. Dieses Gesetz war revolutionär, weil es mit der aristotelischen Physik brach, die Ruhe als den natürlichen Zustand der Körper sah und Bewegung als etwas, das einer ständigen Ursache bedarf. Newton erkannte, dass Gleichförmigkeit — sowohl Ruhe als auch geradlinige Gleichförmigkeit — der natürliche Zustand ist, und dass es einer Kraft bedarf, um von diesem Zustand abzuweichen. Das erste Gesetz definiert auch den Begriff des Inertialsystems: Ein Bezugssystem, in dem das erste Gesetz gilt, heißt Inertialsystem. Rotierende Bezugssysteme sind keine Inertialsysteme.</p>\n\n<p>Newtons zweites Gesetz ist das Herzstück der klassischen Mechanik: F⃗_netto = m · a⃗. Die Vektorsumme aller auf einen Körper wirkenden Kräfte ist gleich dem Produkt aus seiner Masse m und seiner Beschleunigung a⃗. Dieses Gesetz ist eine Differentialgleichung zweiter Ordnung: F⃗(t, r⃗, v⃗) = m · d²r⃗/dt². Sie sagt uns, wie das System zeitlich evolviert, wenn Anfangsposition und -geschwindigkeit bekannt sind. Die Präzision und Allgemeingültigkeit dieser Gleichung ist schier unglaublich: Sie beschreibt den Fall eines Apfels ebenso wie die Bahn des Mondes, die Dynamik eines Pendels ebenso wie die Kollision von Billardkugeln.</p>\n\n<p>Die Masse m in F⃗ = ma⃗ wird als träge Masse bezeichnet — sie misst den Widerstand eines Körpers gegen Beschleunigung. Eine doppelte Masse bedeutet, dass dieselbe Kraft nur die halbe Beschleunigung erzeugt. Das SI-Einheitensystem leitet daraus die Einheit der Kraft ab: 1 Newton (N) = 1 kg · m/s². Ein Newton ist die Kraft, die einem 1-kg-Körper eine Beschleunigung von 1 m/s² erteilt. Die Gewichtskraft, die die Erde auf einen Körper ausübt, beträgt F_G = mg, wobei g ≈ 9,81 m/s² die Erdbeschleunigung ist. Ein Körper der Masse 1 kg hat also ein Gewicht von etwa 9,81 N.</p>\n\n<p>Newtons drittes Gesetz, das Wechselwirkungsgesetz, lautet: Wenn Körper A auf Körper B eine Kraft F⃗_AB ausübt, dann übt Körper B auf Körper A gleichzeitig eine entgegengesetzte Kraft F⃗_BA = -F⃗_AB aus. Diese beiden Kräfte — oft als \"actio\" und \"reactio\" bezeichnet — sind gleich groß, entgegengesetzt gerichtet und greifen an verschiedenen Körpern an. Das letzte Punkt ist entscheidend: Das dritte Newton-Gesetz schließt sich nicht selbst auf (die beiden Kräfte heben sich nicht gegenseitig auf), weil sie verschiedene Körper als Angriffspunkt haben. Wenn Sie gegen eine Wand drücken, drückt die Wand gleich stark gegen Sie zurück — das ist keine Trivialität, sondern eine fundamentale Symmetrie der Natur.</p>\n\n<p>Die Methode zur Lösung von Newton-Problemen ist systematisch: (1) System identifizieren — welcher Körper wird betrachtet? (2) Freikörperdiagramm zeichnen — alle Kräfte, die auf diesen Körper wirken, als Pfeile einzeichnen. (3) Koordinatensystem wählen und die x- und y-Komponenten der Kräfte bestimmen. (4) Die Newton-Gleichungen aufstellen: ΣFₓ = maₓ und ΣF_y = ma_y. (5) Auflösen nach der gesuchten Größe.</p>\n\n<p>Das Freikörperdiagramm ist ein unverzichtbares Werkzeug. Betrachten wir einen Körper der Masse m auf einer Waage: Die Gewichtskraft F_G = mg zieht nach unten, die Normalkraft N der Waage drückt nach oben. Ist der Körper in Ruhe (a = 0), dann gilt: N - mg = 0, also N = mg. Bewegt sich die Waage nach oben mit a > 0 (z.B. im Fahrstuhl), dann gilt N - mg = ma, also N = m(g + a). Der Körper erscheint schwerer — ein Phänomen, das Astronauten bei Starts erleben. Bei freiem Fall (a = -g): N = m(g - g) = 0. Schwerlosigkeit!</p>\n\n<p>Das Konzept des Kräftegleichgewichts (ΣF⃗ = 0 bedeutet a⃗ = 0) ist der Sonderfall des zweiten Newton-Gesetzes für den statischen oder gleichförmig bewegten Körper. Die Statik — die Lehre vom Gleichgewicht ruhender Körper — ist ein eigenes Kapitel, das wir in Kapitel 16 behandeln.</p>\n\n<p>Eine wichtige Klasse von Kräften sind Kontaktkräfte: die Normalkraft (senkrecht zur Kontaktfläche), die Reibungskraft (parallel zur Kontaktfläche), Seilspannungen und Federkräfte. Kontaktkräfte entstehen durch elektromagnetische Wechselwirkungen auf atomarer Ebene — makroskopisch erscheinen sie jedoch als eigenständige Kräfte. Fernwirkungskräfte (wie Gravitation und Elektrostatik) wirken hingegen über Distanz, ohne direkten Kontakt.</p>\n\n<p>Schließlich sei die tiefe Frage erwähnt: Was ist Masse wirklich? Newton unterschied träge Masse (Widerstand gegen Beschleunigung, F = ma) und schwere Masse (Stärke der Gravitationswechselwirkung, F_G = mg). Das experimentell beobachtete Äquivalenzprinzip — dass träge und schwere Masse identisch sind — war für Newton ein Kuriosum. Für Einstein wurde es zur Grundlage der allgemeinen Relativitätstheorie: Wenn träge und schwere Masse nicht zu unterscheiden sind, dann ist Gravitation keine Kraft, sondern die Krümmung der Raumzeit. Diesen tiefen Zusammenhang werden wir in Kapitel 147 erforschen.</p>","q1":"Zwei Blöcke, m₁ = 3 kg und m₂ = 5 kg, hängen über eine masselose Seilrolle (Atwood'sche Maschine). Berechnen Sie die Beschleunigung des Systems und die Seilspannung T. Verwenden Sie g = 9,81 m/s².","s1":"Freikörperdiagramm: Für m₂ (herabfallend): m₂g - T = m₂a. Für m₁ (aufsteigend): T - m₁g = m₁a. Addition: (m₂-m₁)g = (m₁+m₂)a. a = (m₂-m₁)g/(m₁+m₂) = (5-3)·9,81/(3+5) = 2·9,81/8 = 2,45 m/s². T = m₁(g+a) = 3·(9,81+2,45) = 3·12,26 = 36,8 N. Überprüfung: m₂g - T = 5·9,81 - 36,8 = 49,05 - 36,8 = 12,25 = m₂a = 5·2,45. Stimmt!","q2":"Ein 10-kg-Block liegt auf einem reibungsfreien Tisch und ist über ein Seil mit einem 5-kg-Block verbunden, der über die Tischkante hängt. Berechnen Sie Beschleunigung und Seilspannung. Wie ändert sich die Situation, wenn der Tisch eine Reibungszahl μ_k = 0,3 hat?","s2":"Ohne Reibung: Für den hängenden Block: 5g - T = 5a. Für den Tischblock: T = 10a. Addition: 5g = 15a, a = 5g/15 = g/3 ≈ 3,27 m/s². T = 10a = 10g/3 ≈ 32,7 N. Mit Reibung: Reibungskraft f_k = μ_k·N = 0,3·10g = 29,4 N (hemmt Bewegung). Gleichung für Tischblock: T - f_k = 10a. Gleichung für hängenden Block: 5g - T = 5a. Addition: 5g - f_k = 15a. a = (5g - 29,4)/15 = (49,05 - 29,4)/15 = 19,65/15 ≈ 1,31 m/s².","q3":"Formulieren Sie das zweite Newtonsche Gesetz für ein System von N Teilchen und zeigen Sie, dass das Gesamtsystem sich so verhält, als ob alle äußeren Kräfte am Schwerpunkt angreifen. Der Schwerpunkt ist definiert als r⃗_S = (Σᵢ mᵢ r⃗ᵢ) / M, wobei M = Σᵢ mᵢ die Gesamtmasse ist.","s3":"Für Teilchen i gilt: mᵢ ü⃗ᵢ = F⃗ᵢ_ext + Σⱼ≠ᵢ F⃗ᵢⱼ, wobei F⃗ᵢⱼ die innere Kraft von j auf i ist. Summation über alle i: Σᵢ mᵢ ü⃗ᵢ = Σᵢ F⃗ᵢ_ext + Σᵢ Σⱼ≠ᵢ F⃗ᵢⱼ. Nach dem dritten Newtonschen Gesetz ist F⃗ᵢⱼ = -F⃗ⱼᵢ, also heben sich alle inneren Kräfte in der Doppelsumme paarweise auf. Es bleibt: Σᵢ mᵢ ü⃗ᵢ = F⃗_ext_total. Da r⃗_S = (Σᵢ mᵢ r⃗ᵢ)/M, gilt M·r⃗̈_S = Σᵢ mᵢ ü⃗ᵢ = F⃗_ext. Der Schwerpunkt bewegt sich also wie ein Punktteilchen der Gesamtmasse M unter der resultierenden äußeren Kraft — ein fundamentales Ergebnis der Mechanik."},{"n":6,"title":"Reibung","part":"I","area":"Klassische Mechanik","text":"<p>Dieses Kapitel widmet sich dem Thema <em>Reibung</em> im Rahmen des Gebietes Klassische Mechanik. Sie bauen auf den bisherigen Kapiteln auf und erweitern Ihr Verständnis der Physik um einen weiteren fundamentalen Baustein.</p>\n<p>Die Physik ist eine Disziplin, die durch schrittweises Aufbauen von Verständnis lebt. Jedes Konzept, das Sie in diesem Kapitel kennenlernen, steht in direktem Zusammenhang mit dem Erlernten und bereitet auf die folgenden Kapitel vor. Ohne das Fundament aus den vorherigen Kapiteln wäre das Verständnis des vorliegenden Themas unmöglich — und umgekehrt führt dieses Kapitel direkt zu den nächsten Themen.</p>\n<p>Im Laufe dieses Kapitels werden Sie die zentralen Formeln und Konzepte von <em>Reibung</em> kennenlernen, verstehen und anwenden. Physikalische Formeln sind keine willkürlichen Gleichungen, die auswendig gelernt werden müssen — sie sind verdichtete Aussagen über die Natur, die sich aus tiefen Symmetrien und Erhaltungsgesetzen der Physik ergeben. Das Ziel ist nicht das Memorieren, sondern das Verstehen: Warum gilt diese Formel? Was bedeuten ihre Symbole? In welchem Bereich ist sie gültig?</p>\n<p>Die historische Entwicklung dieses Themas ist faszinierend. Die Entdeckung der zugrundeliegenden Gesetze war oft das Resultat jahrelanger Experimente, genialer Intuitionen und mutiger Spekulationen. Die Physiker, die diese Zusammenhänge entdeckten, revolutionierten unser Weltbild und eröffneten technologische Möglichkeiten, die vorher undenkbar waren.</p>\n<p>Mathematisch wird dieses Kapitel Kenntnisse der Differential- und Integralrechnung, der linearen Algebra und ggf. der gewöhnlichen Differentialgleichungen voraussetzen und erweitern. Die Physik ist die Muttersprache der Mathematik in ihrer angewandten Form — mathematische Strukturen, die abstrakt entwickelt wurden, finden hier ihre Entsprechungen in der Natur.</p>\n<p>Die praktischen Anwendungen des Themas <em>Reibung</em> sind weitreichend. Von der Technologie, die unseren Alltag bestimmt, bis zu den großen wissens // ===== APP STATE =====
let currentChapter = 0;
let sidebarOpen = true;
let completed = {};

// ===== NAVIGATION =====
function startApp(){
  document.getElementById('home').style.display='none';
  document.getElementById('main').classList.add('active');
  buildSidebar();
  showChapter(0);
}

function buildSidebar(){
  const list = document.getElementById('sidebar-list');
  list.innerHTML='';
  let lastPart='';
  CHS.forEach((ch,i)=>{
    if(ch.part!==lastPart){
      const ph=document.createElement('div');
      ph.className='part-header';
      ph.textContent='Teil '+ch.part+' — '+ch.area;
      list.appendChild(ph);
      lastPart=ch.part;
    }
    const item=document.createElement('div');
    item.className='ch-item';
    item.id='sitem-'+i;
    item.textContent=ch.n+'. '+ch.title;
    item.onclick=()=>showChapter(i);
    list.appendChild(item);
  });
}

function showChapter(idx){
  if(idx<0||idx>=CHS.length)return;
  currentChapter=idx;
  const ch=CHS[idx];

  // Update sidebar
  document.querySelectorAll('.ch-item').forEach(el=>el.classList.remove('active'));
  const si=document.getElementById('sitem-'+idx);
  if(si){si.classList.add('active');si.scrollIntoView({block:'nearest'});}

  // Update topbar
  document.getElementById('topbar-title').textContent='Kap. '+ch.n+' — '+ch.title;
  const pct=Math.round(((idx+1)/200)*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-label').textContent=(idx+1)+' / 200';

  // Build content
  const area=document.getElementById('content-area');
  area.scrollTop=0;
  area.innerHTML=renderChapter(ch,idx);
}

function renderChapter(ch,idx){
  return `<div class="ch-card">
    <div class="ch-label">Teil ${ch.part} &mdash; ${ch.area} &mdash; Kapitel ${ch.n}</div>
    <div class="ch-title">${ch.title}</div>
    <div class="ch-rule"></div>
    <div class="ch-text">${ch.text}</div>
  </div>
  <div class="ex-section">
    <div class="ex-title">Uebungsaufgaben</div>
    <div class="ex-rule"></div>
    ${renderEx(idx,1,ch.q1,ch.s1)}
    ${renderEx(idx,2,ch.q2,ch.s2)}
    ${renderEx(idx,3,ch.q3,ch.s3)}
  </div>
  <div class="nav-row">
    <button class="nav-btn" onclick="showChapter(${idx-1})" ${idx===0?'disabled':''}>&#8592; Vorheriges</button>
    <button class="nav-btn" onclick="showChapter(${idx+1})" ${idx===199?'disabled':''}>Naechstes &#8594;</button>
  </div>`;
}

function renderEx(chIdx,num,q,sol){
  const id=`ex-${chIdx}-${num}`;
  return `<div class="ex-block">
    <div class="ex-num">AUFGABE ${num}</div>
    <div class="ex-q">${q}</div>
    <textarea class="ex-ta" id="${id}" placeholder="Ihre Loesung hier..."></textarea>
    <div>
      <button class="ex-btn" onclick="showSol('${id}-sol')">Musterloesung anzeigen</button>
    </div>
    <div class="ex-sol" id="${id}-sol">${sol}</div>
  </div>`;
}

function showSol(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.style.display=el.style.display==='block'?'none':'block';
}

function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed',!sidebarOpen);
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(!document.getElementById('main').classList.contains('active'))return;
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')showChapter(currentChapter+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')showChapter(currentChapter-1);
});
</script>
